<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MTM Customs | Clearing the Way for Trade</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            color: #076795;
        }

        .container {
            width: 90%;
            max-width: 850px;
            text-align: center;
            padding: 50px 25px;
        }

        .logo {
            width: 100%;
            max-width: 550px;
            height: auto;
            margin-bottom: 25px;
        }

        h1 {
            margin: 10px 0;
            font-size: 28px;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .tagline {
            margin: 12px 0 35px;
            font-size: 22px;
            font-style: italic;
        }

        .coming-soon {
            margin: 30px 0 18px;
            font-size: 17px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #6f7377;
        }

        .contact {
            margin-top: 25px;
            font-size: 18px;
        }

        .contact a {
            color: #076795;
            text-decoration: none;
        }

        .contact a:hover {
            text-decoration: underline;
        }

        .accent {
            width: 80px;
            height: 4px;
            background: #f36f32;
            margin: 30px auto;
        }
    </style>
</head>

<body>

<div class="container">

    <img src="logo.png"
         alt="MTM Customs"
         class="logo">

    <div class="accent"></div>

    <p class="tagline">Clearing the Way for Trade</p>

    <p class="coming-soon">
        Our new website is coming soon
    </p>

    <p class="contact">
        For enquiries, please contact
        <a href="mailto:info@mtmcustoms.co.uk">
            info@mtmcustoms.co.uk
        </a>
    </p>

</div>

</body>
</html>
